<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario GYC Costa Rica 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:  #003b5d;
      --teal:  #2d7d92;
      --gold:  #fec401;

      --g-a:   #003b5d;   /* Ene–Abr */
      --g-b:   #2d7d92;   /* May–Ago */
      --g-c:   #b07d2a;   /* Sep–Dic */

      --done-bg:     #f4f4f4;
      --done-border: #bdbdbd;
      --done-text:   #9e9e9e;

      --curr-bg:     #fff3f3;
      --curr-border: #e53935;
      --curr-text:   #c62828;

      --board-bg:     #f8f0ff;
      --board-border: #8e24aa;
      --board-text:   #6a1b9a;

      --bg:     #f0f2f5;
      --card:   #ffffff;
      --line:   #e0e4ea;
      --txt:    #1a202c;
      --muted:  #6b7280;
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── HEADER (mobile base) ── */
    header {
      background: var(--navy);
      padding: 0 14px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 14px rgba(0,0,0,0.25);
    }
    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-text {
      font-family: 'Cinzel', serif;
      font-size: 14px; font-weight: 600;
      color: #fff;
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 10px; font-weight: 400;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3px;
    }
    .year-pill {
      background: var(--gold);
      color: var(--navy);
      font-family: 'Cinzel', serif;
      font-weight: 700; font-size: 11px;
      padding: 3px 10px; border-radius: 12px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* ── FILTER BAR ── */
    .filter-bar {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 8px 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-row {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 6px;
      white-space: nowrap;
    }
    .fpill {
      padding: 5px 12px;
      border-radius: 16px;
      border: 1.5px solid var(--line);
      font-size: 12px; font-weight: 500;
      cursor: pointer;
      background: #fff;
      color: var(--muted);
      transition: all 0.15s;
      font-family: inherit;
      -webkit-user-select: none; user-select: none;
    }
    .fpill.active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .fpill:active { opacity: 0.75; }

    /* ── MAIN ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 14px 10px 60px;
    }

    /* ── STATS ── */
    .stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .stat-box {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 8px;
      text-align: center;
    }
    .stat-n {
      font-family: 'Cinzel', serif;
      font-size: 22px; font-weight: 700; line-height: 1;
      margin-bottom: 3px;
    }
    .stat-l { font-size: 11px; color: var(--muted); }
    .stat-box.s-total .stat-n    { color: var(--navy); }
    .stat-box.s-upcoming .stat-n { color: var(--teal); }
    .stat-box.s-done .stat-n     { color: var(--done-text); }

    /* ── LEYENDA ── */
    .legend {
      display: flex; flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 14px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .ldot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* ── TOGGLE COMPLETADOS ── */
    .toggle-done {
      display: block; width: 100%;
      padding: 9px;
      background: none;
      border: 1.5px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px; font-family: inherit;
      cursor: pointer;
      margin-bottom: 18px;
      transition: all 0.15s;
    }
    .toggle-done:active { background: var(--bg); }

    /* ── MES GROUP ── */
    .month-group { margin-bottom: 24px; }
    .month-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .month-label {
      font-family: 'Cinzel', serif;
      font-size: 15px; font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--navy);
      white-space: nowrap;
    }
    .month-line { flex: 1; height: 1px; background: var(--line); }
    .month-count {
      font-size: 10px; color: var(--muted);
      background: var(--bg);
      padding: 2px 7px; border-radius: 10px;
      border: 1px solid var(--line);
      white-space: nowrap;
    }

    /* ── EVENT CARD ── */
    .e-wrap { margin-bottom: 7px; border-radius: var(--radius); overflow: hidden; }

    .e-card {
      display: flex;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      -webkit-user-select: none; user-select: none;
    }
    .e-wrap.has-detail .e-card { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

    /* Tap feedback */
    .e-card:active { opacity: 0.9; }

    /* Left color bar */
    .e-bar { width: 4px; flex-shrink: 0; }

    /* Date badge */
    .e-date {
      width: 50px; flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px 2px;
      border-right: 1px solid var(--line);
    }
    .e-day {
      font-family: 'Cinzel', serif;
      font-size: 20px; font-weight: 700; line-height: 1;
    }
    .e-mon {
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.3px; text-transform: uppercase;
      color: var(--muted); margin-top: 2px;
    }
    .e-dow { font-size: 9px; color: var(--muted); margin-top: 1px; }

    /* Body */
    .e-body { flex: 1; min-width: 0; padding: 10px 10px; }
    .e-name {
      font-size: 13px; font-weight: 600;
      line-height: 1.35; margin-bottom: 4px;
      word-break: break-word;
    }
    .e-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-bottom: 5px; }
    .e-mi { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      font-size: 10px; padding: 1px 7px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .mod-badge {
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.3px;
      padding: 2px 6px; border-radius: 4px;
      text-transform: uppercase;
    }
    .mod-p { background: #e8f5e9; color: #2e7d32; }
    .mod-v { background: #e3f2fd; color: #1565c0; }

    /* Right status */
    .e-status {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px 8px;
      gap: 2px;
      text-align: center;
      min-width: 50px;
    }
    .e-days { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; line-height: 1; }
    .e-dlabel { font-size: 9px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); }
    .e-chevron { display: none; }

    /* ── CARD FOOTER ── */
    .e-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px dashed var(--line);
      gap: 8px;
    }
    .e-ver-mas {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 11px; font-weight: 600;
      color: var(--teal);
      flex: 1;
    }
    .has-detail .e-ver-mas { display: flex; }
    .e-vm-arrow {
      display: inline-block;
      font-size: 13px; line-height: 1;
      transition: transform 0.22s ease;
      flex-shrink: 0;
    }
    .e-wrap.expanded .e-vm-arrow { transform: rotate(180deg); }
    .vm-open  { display: inline; }
    .vm-close { display: none; }
    .e-wrap.expanded .vm-open  { display: none; }
    .e-wrap.expanded .vm-close { display: inline; }
    .e-add-cal {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600;
      color: var(--navy);
      background: rgba(0,59,93,0.07);
      border: 1.5px solid rgba(0,59,93,0.2);
      border-radius: 7px;
      padding: 3px 9px;
      cursor: pointer;
      font-family: inherit;
      -webkit-user-select: none; user-select: none;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }
    .has-detail .e-add-cal { margin-left: 0; }
    .e-add-cal:active { background: rgba(0,59,93,0.18); }

    /* ── DOWNLOAD BAR ── */
    .dl-bar {
      background: rgba(0,59,93,0.04);
      border-bottom: 1px solid var(--line);
      padding: 8px 14px;
    }
    .dl-inner {
      max-width: 860px; margin: 0 auto;
      display: flex; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }
    .dl-all-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      background: var(--navy); color: white;
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      -webkit-user-select: none; user-select: none;
      transition: opacity 0.15s;
    }
    .dl-all-btn:active { opacity: 0.75; }
    .dl-hint { font-size: 11px; color: var(--muted); }

    /* ── EXPAND PANEL ── */
    .e-detail {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.28s ease;
      background: var(--card);
      border: 1px solid var(--line);
      border-top: none;
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
    }
    .e-wrap.expanded .e-detail { max-height: 300px; }
    .e-detail-inner { padding: 10px 14px 12px; }
    .e-detail-row { margin-bottom: 8px; }
    .e-detail-row:last-child { margin-bottom: 0; }
    .e-detail-label {
      display: block;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--muted); margin-bottom: 3px;
    }
    .e-detail-text {
      font-size: 12px; line-height: 1.5; color: var(--txt);
    }

    /* ── STATE CLASSES ── */
    .st-a .e-bar  { background: var(--g-a); }
    .st-a .e-day  { color: var(--g-a); }
    .st-a .e-days { color: var(--g-a); }

    .st-b .e-bar  { background: var(--g-b); }
    .st-b .e-day  { color: var(--g-b); }
    .st-b .e-days { color: var(--g-b); }

    .st-c .e-bar  { background: var(--g-c); }
    .st-c .e-day  { color: var(--g-c); }
    .st-c .e-days { color: var(--g-c); }

    .st-done { opacity: 0.5; }
    .st-done .e-card { background: var(--done-bg); }
    .st-done .e-bar  { background: var(--done-border); }
    .st-done .e-day  { color: var(--done-text); }

    .st-cancelled { opacity: 0.6; }
    .st-cancelled .e-card { background: #fff5f5; }
    .st-cancelled .e-bar  { background: #ef5350; }
    .st-cancelled .e-day  { color: var(--done-text); }
    .st-cancelled .e-name { text-decoration: line-through; color: #9e9e9e; }
    .st-cancelled .e-days { color: #ef5350; }
    .st-cancelled .e-detail { background: #fff5f5; border-color: #ffcdd2; }

    .st-curr .e-card { background: var(--curr-bg); border-color: #fcc; }
    .st-curr .e-bar  { background: var(--curr-border); }
    .st-curr .e-day  { color: var(--curr-text); }
    .st-curr .e-days { color: var(--curr-text); }
    .st-curr .e-name { color: var(--curr-text); }
    .st-curr .e-detail { background: var(--curr-bg); border-color: #fcc; }

    .st-board .e-card { background: var(--board-bg); border-color: #e1c4f0; }
    .st-board .e-bar  { background: var(--board-border); }
    .st-board .e-day  { color: var(--board-text); }
    .st-board .e-days { color: var(--board-text); }
    .st-board .e-name { color: var(--board-text); }
    .st-board .e-detail { background: var(--board-bg); border-color: #e1c4f0; }

    /* Pulso hoy */
    .pulse-dot {
      display: inline-block; width: 7px; height: 7px;
      background: var(--curr-text); border-radius: 50%;
      margin-right: 4px; vertical-align: middle;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:0.6} }

    /* ── LOADING / EMPTY ── */
    .loading, .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--line); border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── FOOTER ── */
    footer { text-align: center; padding: 14px; font-size: 11px; color: var(--muted); }

    /* ── MONTH NAV ── */
    .month-nav {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 6px 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: sticky;
      top: 52px;
      z-index: 190;
    }
    .month-nav::-webkit-scrollbar { display: none; }
    .month-nav-inner {
      max-width: 860px; margin: 0 auto;
      display: flex; gap: 5px;
      white-space: nowrap;
    }
    .m-pill {
      padding: 4px 10px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      font-size: 11px; font-weight: 600;
      cursor: pointer; background: #fff; color: var(--muted);
      font-family: inherit; transition: all 0.15s;
      -webkit-user-select: none; user-select: none; flex-shrink: 0;
    }
    .m-pill.curr-month { border-color: var(--teal); color: var(--teal); }
    .m-pill.at-section { background: var(--teal); border-color: var(--teal); color: #fff; }
    .m-pill:active { opacity: 0.7; }

    /* ── BACK TO TOP ── */
    .back-top {
      position: fixed;
      bottom: 22px; right: 16px;
      width: 42px; height: 42px;
      background: var(--navy); color: #fff;
      border: none; border-radius: 50%;
      font-size: 20px; line-height: 1;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(0,0,0,0.28);
      z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    .back-top.visible { opacity: 1; pointer-events: auto; }
    .back-top:active { opacity: 0.75; }

    /* ── DESKTOP ENHANCEMENTS ── */
    @media (min-width: 600px) {
      header { padding: 0 24px; }
      .header-inner { height: 58px; }
      .brand-text { font-size: 15px; }
      main { padding: 20px 16px 60px; }
      .filter-bar { padding: 9px 24px; }
      .filter-row { gap: 7px; }
      .fpill { padding: 5px 13px; }
      .stats-row { gap: 10px; margin-bottom: 18px; }
      .stat-box { padding: 12px 14px; }
      .stat-n { font-size: 26px; }
      .e-date { width: 58px; }
      .e-day { font-size: 22px; }
      .e-days { font-size: 17px; }
      .e-status { min-width: 54px; padding: 10px 10px; }
      .e-name { font-size: 13px; }
      .e-body { padding: 10px 12px; }
    }
  </style>
</head>

// ── HELPERS ──
const MON_S = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DOW_S = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

function daysUntil(f) {
  if (!f) return null;
  const ev = new Date(f + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((ev - now) / 86400000);
}

function monthGroup(mes) {
  const m = (mes||'').toLowerCase();
  const A = ['enero','febrero','marzo','abril'];
  const B = ['mayo','junio','julio','agosto'];
  return A.some(x=>m.includes(x)) ? 'a' : B.some(x=>m.includes(x)) ? 'b' : 'c';
}

function eventState(ev) {
  if ((ev.tiempoRestante||'').toLowerCase() === 'completado') return 'done';
  if ((ev.tiempoRestante||'').toLowerCase() === 'cancelado')  return 'cancelled';
  const d = daysUntil(ev.fecha);
  if (d !== null && d < 0) return 'done'; // pasado → completado automático
  if (d !== null) {
    const now = new Date();
    const edt = new Date(ev.fecha + 'T00:00:00');
    if (now.getFullYear()===edt.getFullYear() && now.getMonth()===edt.getMonth() && d >= 0) return 'curr';
  }
  const n = (ev.actividad||'').toLowerCase();
  if (n.includes('reunión directiva') || n.includes('reunion directiva')) return 'board';
  return monthGroup(ev.mes);
}

function fmtDays(d, state) {
  if (state==='done')      return {n:'✓', l:'Completado'};
  if (state==='cancelled') return {n:'✕', l:'Cancelado'};
  if (d===null)       return {n:'—', l:''};
  if (d<0)            return {n:'✓', l:'Pasado'};
  if (d===0)          return {n:'¡HOY!', l:'', today:true};
  if (d===1)          return {n:'1', l:'día'};
  if (d<30)           return {n:d, l:'días'};
  const mo=Math.floor(d/30), dy=d%30;
  if (dy===0) return {n:mo+'m', l:''};
  return {n:mo+'m '+dy+'d', l:''};
}

// ── ICS / CALENDAR EXPORT ──
function escICS(s) {
  if (!s) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
}

function parse24h(t) {
  if (!t) return null;
  const s = t.toLowerCase().replace(/\s/g,'');
  const pm = s.includes('p');
  const nums = s.match(/\d+/g) || [];
  let h = parseInt(nums[0]||0), m = parseInt(nums[1]||0);
  if (pm && h !== 12) h += 12;
  if (!pm && h === 12) h = 0;
  return String(h).padStart(2,'0') + String(m).padStart(2,'0') + '00';
}

function nextDayStr(fechaStr) {
  const d = new Date(fechaStr + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0,10).replace(/-/g,'');
}

function buildVEVENT(ev, uid) {
  const dc = ev.fecha.replace(/-/g,'');
  let dtStart, dtEnd;
  if (ev.horaInicio) {
    const s = parse24h(ev.horaInicio);
    const e = ev.horaCierre ? parse24h(ev.horaCierre)
      : String(parseInt(s.slice(0,2))+2).padStart(2,'0') + s.slice(2);
    dtStart = `DTSTART;TZID=America/Costa_Rica:${dc}T${s}`;
    dtEnd   = `DTEND;TZID=America/Costa_Rica:${dc}T${e}`;
  } else {
    dtStart = `DTSTART;VALUE=DATE:${dc}`;
    dtEnd   = `DTEND;VALUE=DATE:${nextDayStr(ev.fecha)}`;
  }
  const desc = [
    ev.objetivo    ? `Objetivo: ${escICS(ev.objetivo)}`       : '',
    ev.comentarios ? `Observaciones: ${escICS(ev.comentarios)}` : '',
    ev.encargados  ? `Encargados: ${escICS(ev.encargados)}`   : '',
    ev.modalidad   ? `Modalidad: ${ev.modalidad}`              : '',
  ].filter(Boolean).join('\\n\\n');
  const lines = [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)}Z`,
    dtStart, dtEnd,
    `SUMMARY:GYC · ${escICS(ev.actividad)}`,
  ];
  if (desc)     lines.push(`DESCRIPTION:${desc}`);
  if (ev.lugar) lines.push(`LOCATION:${escICS(ev.lugar)}`);
  lines.push('END:VEVENT');
  return lines.join('\r\n');
}

const ICS_HEAD = [
  'BEGIN:VCALENDAR','VERSION:2.0',
  'PRODID:-//GYC Costa Rica//Calendario 2026//ES',
  'CALSCALE:GREGORIAN','METHOD:PUBLISH',
  'X-WR-CALNAME:GYC Costa Rica 2026',
  'X-WR-TIMEZONE:America/Costa_Rica',
  'BEGIN:VTIMEZONE','TZID:America/Costa_Rica',
  'BEGIN:STANDARD',
  'TZOFFSETFROM:-0600','TZOFFSETTO:-0600','TZNAME:CST',
  'DTSTART:19700101T000000',
  'END:STANDARD','END:VTIMEZONE',
].join('\r\n');

function wrapICS(body) {
  return ICS_HEAD + '\r\n' + body + '\r\nEND:VCALENDAR';
}

function dlICS(content, filename) {
  const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

function downloadAll() {
  const body = allEvents
    .filter(e => e.fecha && e.actividad)
    .map((e,i) => buildVEVENT(e, `gyc2026-${e.fecha.replace(/-/g,'')}-${i}@gyc-cr`))
    .join('\r\n');
  dlICS(wrapICS(body), 'GYC-Costa-Rica-2026.ics');
}

function downloadOne(ev) {
  const body = buildVEVENT(ev, `gyc-${ev.fecha.replace(/-/g,'')}-${Date.now()}@gyc-cr`);
  const slug = (ev.actividad||'evento').slice(0,25).replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚüÜñÑ]/g,'-');
  dlICS(wrapICS(body), `GYC-${ev.fecha}-${slug}.ics`);
}

// ── RENDER CARD ──
function cardHTML(ev, idx) {
  const state = eventState(ev);
  const d   = daysUntil(ev.fecha);
  const di  = fmtDays(d, state);
  const dt  = ev.fecha ? new Date(ev.fecha+'T00:00:00') : null;
  const dayN = dt ? dt.getDate() : '?';
  const monS = dt ? MON_S[dt.getMonth()] : '';
  const dowS = dt ? DOW_S[dt.getDay()] : (ev.diaSem||'');

  // All chips shown — no truncation
  const chips = (ev.encargados||'').split(',').map(s=>s.trim()).filter(Boolean);
  const chipHTML = chips.length
    ? `<div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`
    : '';

  const isVirtual = (ev.modalidad||'').toLowerCase().includes('virtual');
  const modHTML = ev.modalidad
    ? `<span class="mod-badge ${isVirtual?'mod-v':'mod-p'}">${isVirtual?'Virtual':'Presencial'}</span>`
    : '';

  const placeHTML = ev.lugar ? `<span class="e-mi">📍 ${ev.lugar}</span>` : '';
  const timeHTML  = ev.horaInicio ? `<span class="e-mi">🕐 ${ev.horaInicio}${ev.horaCierre?' – '+ev.horaCierre:''}</span>` : '';
  const pulseHTML = di.today ? `<span class="pulse-dot"></span>` : '';

  const hasDetail = !!(ev.objetivo || ev.comentarios);

  // Build detail panel
  let detailHTML = '';
  if (hasDetail) {
    let rows = '';
    if (ev.objetivo)    rows += `<div class="e-detail-row"><span class="e-detail-label">Objetivo</span><span class="e-detail-text">${ev.objetivo}</span></div>`;
    if (ev.comentarios) rows += `<div class="e-detail-row"><span class="e-detail-label">Observaciones</span><span class="e-detail-text">${ev.comentarios}</span></div>`;
    detailHTML = `<div class="e-detail"><div class="e-detail-inner">${rows}</div></div>`;
  }

  const footerHTML = `<div class="e-card-footer">
      <div class="e-ver-mas">
        <span class="e-vm-arrow">▾</span>
        <span class="vm-open">Ver detalle</span>
        <span class="vm-close">Ocultar</span>
      </div>
      <button class="e-add-cal" data-idx="${idx}">📅 Añadir</button>
    </div>`;

  return `
    <div class="e-wrap st-${state}${hasDetail?' has-detail':''}" data-idx="${idx}">
      <div class="e-card">
        <div class="e-bar"></div>
        <div class="e-date">
          <div class="e-day">${dayN}</div>
          <div class="e-mon">${monS}</div>
          <div class="e-dow">${dowS}</div>
        </div>
        <div class="e-body">
          <div class="e-name">${pulseHTML}${ev.actividad||'—'}</div>
          <div class="e-meta">${placeHTML}${timeHTML}${modHTML}</div>
          ${chipHTML}
          ${footerHTML}
        </div>
        <div class="e-status">
          <div class="e-days">${di.n}</div>
          ${di.l?`<div class="e-dlabel">${di.l}</div>`:''}
        </div>
      </div>
      ${detailHTML}
    </div>`;
}

// ── STATE ──
let allEvents = [], showDone = false, activeFilter = 'all';

// ── RENDER ──
function render() {
  let evs = allEvents.map((e,i) => ({...e, _idx:i}));

  if (activeFilter === 'upcoming') evs = evs.filter(e => {
    const d = daysUntil(e.fecha);
    const tr = (e.tiempoRestante||'').toLowerCase();
    return d !== null && d >= 0 && tr !== 'completado' && tr !== 'cancelado';
  });
  else if (activeFilter === 'presencial') evs = evs.filter(e => !(e.modalidad||'').toLowerCase().includes('virtual'));
  else if (activeFilter === 'virtual')    evs = evs.filter(e =>  (e.modalidad||'').toLowerCase().includes('virtual'));
  else if (activeFilter === 'board')      evs = evs.filter(e => {
    const n = (e.actividad||'').toLowerCase();
    return n.includes('reunión directiva') || n.includes('reunion directiva');
  });

  if (!showDone) evs = evs.filter(e => {
    const tr = (e.tiempoRestante||'').toLowerCase();
    if (tr === 'completado' || tr === 'cancelado') return false;
    const d = daysUntil(e.fecha);
    return d === null || d >= 0; // ocultar también los pasados automáticos
  });

  const cal = document.getElementById('cal');

  if (!evs.length) {
    cal.innerHTML = `<div class="empty">📅 No hay actividades para mostrar.</div>`;
    return;
  }

  const grouped = new Map();
  evs.forEach(e => {
    const k = e.mes || 'Sin mes';
    if (!grouped.has(k)) grouped.set(k, []);
    grouped.get(k).push(e);
  });

  let html = '';
  for (const [month, mes_evs] of grouped) {
    const cnt = mes_evs.length;
    const id = 'mes-' + month.toLowerCase().replace(/\s+/g,'-');
    html += `<div class="month-group" id="${id}">
      <div class="month-header">
        <div class="month-label">${month}</div>
        <div class="month-line"></div>
        <div class="month-count">${cnt} ${cnt===1?'actividad':'actividades'}</div>
      </div>
      ${mes_evs.map(e => cardHTML(e, e._idx)).join('')}
    </div>`;
  }
  cal.innerHTML = html;
}

// ── LOAD ──
function loadData() {
  allEvents = DEMO;
  buildMonthNav();
  render();
}

// ── MONTH NAV ──
function buildMonthNav() {
  const months = [], seen = new Set();
  allEvents.forEach(e => { if (e.mes && !seen.has(e.mes)) { months.push(e.mes); seen.add(e.mes); } });

  const now = new Date();
  const MNAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const curFull = MNAMES[now.getMonth()];

  document.getElementById('monthNavInner').innerHTML = months.map(m => {
    const is27 = m.includes('2027');
    const short = is27 ? m.slice(0,3) + '\u00A0\'27' : m.slice(0,3);
    const isCur = m === curFull;
    return `<button class="m-pill${isCur?' curr-month':''}" data-month="${m}">${short}</button>`;
  }).join('');
}

// ── FILTER PILLS ──
document.getElementById('filterRow').addEventListener('click', e => {
  const pill = e.target.closest('.fpill');
  if (!pill) return;
  document.querySelectorAll('.fpill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeFilter = pill.dataset.f;
  render();
});

// ── TOGGLE COMPLETADOS ──
const toggleBtn = document.getElementById('toggleDone');
toggleBtn.addEventListener('click', () => {
  showDone = !showDone;
  toggleBtn.textContent = showDone ? '↑ Ocultar pasados y cancelados' : '↓ Mostrar pasados y cancelados';
  render();
});

// ── MONTH NAV SCROLL ──
document.getElementById('monthNav').addEventListener('click', e => {
  const pill = e.target.closest('.m-pill');
  if (!pill) return;
  const id = 'mes-' + pill.dataset.month.toLowerCase().replace(/\s+/g,'-');
  const el = document.getElementById(id);
  if (!el) return;
  const offset = 52 + 44; // header + month-nav height
  const top = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top, behavior: 'smooth' });
  // highlight active pill
  document.querySelectorAll('.m-pill').forEach(p => p.classList.remove('at-section'));
  pill.classList.add('at-section');
});

// ── BACK TO TOP ──
const backTopBtn = document.getElementById('backTop');
window.addEventListener('scroll', () => {
  backTopBtn.classList.toggle('visible', window.scrollY > 280);
}, { passive: true });
backTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

// ── EXPAND CARD + CALENDAR DOWNLOAD ──
document.getElementById('cal').addEventListener('click', e => {
  // Calendar button — intercept before expand
  const calBtn = e.target.closest('.e-add-cal');
  if (calBtn) {
    e.stopPropagation();
    const i = parseInt(calBtn.dataset.idx);
    if (!isNaN(i) && allEvents[i]) downloadOne(allEvents[i]);
    return;
  }
  // Expand / collapse card
  const card = e.target.closest('.e-card');
  if (!card) return;
  const wrap = card.closest('.e-wrap.has-detail');
  if (!wrap) return;
  wrap.classList.toggle('expanded');
});

document.getElementById('dlAllBtn').addEventListener('click', downloadAll);

loadData();
</script>
</body>
</html>
